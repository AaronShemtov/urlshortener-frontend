<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>1ms — URL Shortener</title>
    <meta
      name="description"
      content="A privacy-respecting URL shortener. Go backend on Kubernetes, Oracle Autonomous JSON Database, deployed via Flux GitOps."
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/blueprint.css" />
    <style>
      /* ====== Shortener-specific extensions to blueprint ====== */
      .shorten-card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 32px;
        margin: 28px 0 0;
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 24px 24px;
        position: relative;
      }
