name: Smoke Tests

# What this checks, and why it looks like this
#
# The previous version POSTed an unauthenticated /shorten and expected 200. It
# failed every day from at least 2026-08-27 without anyone noticing, and by the
# time it was looked at, two separate things were wrong with it:
#
#   1. Cloudflare was refusing the runner outright. GitHub Actions runs from
#      Azure ranges, and the same request from a residential address went
#      straight through — so the test never reached the backend at all and its
#      403 said nothing about the application. The API key header now carries it
#      past that, via a skip rule on the zone.
#   2. /shorten stopped being open, deliberately: it had been used to plant 6002
#      links to phishing pages. A test that expects an unauthenticated write to
#      succeed is now testing for the bug.
#
# It also created a fresh short link on every run, which for a daily cron is 365
# rows a year of nothing. It now writes one fixed code and expects 409 on every
# run after the first, which proves the same thing — the write path is alive and
# authorised — without accumulating anything.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.SMOKE_BASE_URL || 'https://1ms.my' }}
      API_KEY: ${{ secrets.SHORTEN_API_KEY }}
      # Fixed on purpose — see the note above about not accumulating rows.
      SMOKE_CODE: smoke-test
      SMOKE_TARGET: https://example.com/healthcheck/smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the API key is configured
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::SHORTEN_API_KEY is not set on this repository."
            echo "The write endpoints require it (browsers use Turnstile instead,"
            echo "which a CI runner cannot solve). The value is in OCI Vault as"
            echo "'urlshortener-api-key'; add it under Settings > Secrets and"
            echo "variables > Actions."
            exit 1
          fi

      # The property worth guarding above all others: that an anonymous caller
      # cannot write. This is the regression that cost 6002 phishing links.
      # X-Smoke-Check carries the same value as the API key, in a header the
      # application does not read. That is the whole point: it satisfies the
      # zone's skip rule, so Cloudflare lets the request reach the backend, while
      # the backend still sees a caller with no credential and refuses it. Sending
      # X-API-Key here would authorise the write and test nothing.
      #
      # Without it the runner never arrives: Cloudflare answers Azure ranges with
      # a managed challenge, and a challenge page is a 403 that means nothing.
      - name: An unauthenticated write is refused
        id: anon
        continue-on-error: true
        run: |
          set -euo pipefail
          body=$(curl -sS -o /tmp/anon.json -w '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/shorten" \
            -H 'Content-Type: application/json' \
            -H "X-Smoke-Check: $API_KEY" \
            -d '{"url":"https://example.com/should-never-be-created"}')
          echo "HTTP $body"; cat /tmp/anon.json; echo
          if [ "$body" != "403" ]; then
            echo "::error::an anonymous POST /shorten returned $body, expected 403"
            exit 1
          fi
          # A 403 alone is not enough: Cloudflare returns one too, and a test that
          # accepts it would pass while never reaching the application. Only our
          # own JSON proves the refusal came from the code being tested.
          if ! grep -q 'verification required' /tmp/anon.json; then
            echo "::error::403 did not come from the application — the request was"
            echo "blocked upstream, so this run proved nothing about the backend."
            exit 1
          fi

      - name: An authorised write succeeds
        id: write
        continue-on-error: true
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/write.json -w '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/createcustom" \
            -H 'Content-Type: application/json' \
            -H "X-API-Key: $API_KEY" \
            -d "{\"url\":\"$SMOKE_TARGET\",\"code\":\"$SMOKE_CODE\"}")
          echo "HTTP $code"; cat /tmp/write.json; echo
          # 200 the first time this ever ran, 409 every time since. Both mean the
          # request was authorised and reached storage, which is what is being
          # tested; only a 403 or 5xx would be news.
          case "$code" in
            200|409) ;;
            *) echo "::error::authorised POST /createcustom returned $code"; exit 1 ;;
          esac

      - name: The short link redirects
        id: redirect
        continue-on-error: true
        run: |
          set -euo pipefail
          # Both methods, because they have different callers and this project
          # has already been caught serving only one. A person clicking a link
          # sends GET; Slack, Telegram and every other unfurler send HEAD to
          # build a preview, and the reader used to answer those 405.
          fail=0
          for method in GET HEAD; do
            case "$method" in
              GET)  args="";;
              HEAD) args="-I";;
            esac
            status=$(curl -sS -o /dev/null $args --max-redirs 0 -w '%{http_code}' \
              --max-time 30 "$BASE_URL/$SMOKE_CODE")
            location=$(curl -sS $args --max-redirs 0 --max-time 30 -D - -o /dev/null \
              "$BASE_URL/$SMOKE_CODE" \
              | awk -F': ' '/^[Ll]ocation:/ {print $2}' | tr -d '\r')
            echo "$method -> HTTP $status, Location: $location"
            if [ "$status" != "301" ]; then
              echo "::error::$method $BASE_URL/$SMOKE_CODE returned $status, expected 301"
              fail=1
              continue
            fi
            if [ "$location" != "$SMOKE_TARGET" ]; then
              echo "::error::$method redirected to '$location', expected '$SMOKE_TARGET'"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Smoke test passed."

      # Every check runs, then this decides the run. Stopping at the first
      # failure hid which of the two paths — credentialled or anonymous — was
      # actually broken, and they fail for entirely different reasons: one says
      # the backend is wrong, the other says the request never reached it.
      - name: Verdict
        env:
          ANON: ${{ steps.anon.outcome }}
          WRITE: ${{ steps.write.outcome }}
          REDIRECT: ${{ steps.redirect.outcome }}
        run: |
          printf 'anonymous refused : %s\n' "$ANON"
          printf 'authorised write  : %s\n' "$WRITE"
          printf 'redirect          : %s\n' "$REDIRECT"
          for outcome in "$ANON" "$WRITE" "$REDIRECT"; do
            [ "$outcome" = "success" ] || exit 1
          done
