name: Smoke Tests

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.SMOKE_BASE_URL || 'https://1ms.my' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run smoke scenario
        shell: bash
        run: |
          set -euo pipefail
          echo "Using BASE_URL=$BASE_URL"
          # POST to /shorten and capture body + status code
          resp=$(curl -s -w "%{http_code}" -H "Content-Type: application/json" -X POST -d '{"url":"https://example.com/healthcheck/smoke"}' "$BASE_URL/shorten")
          http_code="${resp: -3}"
          body="${resp:0:-3}"
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "POST to /shorten failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi
          code=$(echo "$body" | jq -r '.code // empty')
          if [ -z "$code" ]; then
            echo "Response did not contain 'code'"
            echo "$body"
            exit 1
          fi
          short_url="$BASE_URL/$code"
          echo "Short URL: $short_url"

          # Request headers for the short URL without following redirects
          status=$(curl -s -o /dev/null -I --max-redirs 0 -w "%{http_code}" "$short_url" || true)
          if [ "$status" != "301" ]; then
            echo "Expected HTTP 301 from short URL, got $status"
            curl -sI "$short_url" || true
            exit 1
          fi
          location=$(curl -s -I --max-redirs 0 "$short_url" | awk -F': ' '/^Location:/ {print $2}' | tr -d '\r')
          expected="https://example.com/healthcheck/smoke"
          if ! echo "$location" | grep -q "$expected"; then
            echo "Location header does not contain expected URL. Location: $location"
            exit 1
          fi
          echo "Smoke test passed: $short_url -> $location"
