server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Explicit MIME types — some base images don't include this in http context,
    # which makes nginx send Content-Type: application/octet-stream for everything,
    # causing browsers to download files instead of rendering them.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Healthcheck for k8s probes. text/plain so browsers don't try to download.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static assets — long cache (Cloudflare will also cache these)
    location ~* \.(ico|webp|png|jpg|jpeg|gif|svg|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}